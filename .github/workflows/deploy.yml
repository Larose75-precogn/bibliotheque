name: Publier bibliotheque (librairie Apps Script)
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Laissez-passer clasp
        run: printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      - name: Config clasp
        run: printf '%s' '{"scriptId":"1aEjQ8jEQmpTNXxeygo5QLXMUCTvmEKP5jbnHsi73krhHQBVvcqsiX9ZV","rootDir":""}' > .clasp.json
      - name: Publier (met a jour HEAD + cree une version figee)
        run: |
          npx --yes @google/clasp@3.3.0 push -f
          npx --yes @google/clasp@3.3.0 version "publication auto CI $(date -u +%Y-%m-%dT%H:%M)"
